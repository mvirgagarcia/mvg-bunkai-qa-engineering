# Project configuration consumed by AI agents (Claude, Cursor, Gemini, Codex, etc.)
# when they encounter {{VAR_NAME}} references in skills, commands, templates and docs.
# Variable names are snake_case; the AI maps {{PROJECT_NAME}} -> project.project_name lexically.
# Edit values manually, or run `bun run agents:setup` for an interactive walkthrough.
# Every unfilled field is `null` plus a TODO comment with a concrete example.

project:
  project_name: Bunkai # Project name (e.g. MyProject)
  project_key: BK # Project key in issue tracker (e.g. PROJ, ACME, UPEX). The boilerplate ships this `null` on purpose — the consumer project fills it; never hardcode a real key here.
  webapp_domain: upexbunkai.vercel.app # Domain of the web application under test (e.g. myproject.com)

backend:
  backend_repo: ../upex-bunkai-tms # Relative path to backend repository (e.g. ../my-backend)
  backend_stack: Next.js + supabase + Vercel # Backend technology stack (e.g. Node.js + Express)
  backend_entry: ../upex-bunkai-tms/. # Backend source entry point (e.g. src/)

frontend:
  frontend_repo: ../upex-bunkai-tms/. # Relative path to frontend repository (e.g. ../my-frontend)
  frontend_stack: Next.js # Frontend technology stack (e.g. React + TypeScript)
  frontend_entry: ../upex-bunkai-tms/. # Frontend source entry point (e.g. src/)

database:
  db_type: Supabase Postgres # Database engine (e.g. PostgreSQL)

issue_tracker:
  issue_tracker: Jira # Issue tracking tool (e.g. Jira)
  issue_tracker_cli: acli # CLI command to query tickets (e.g. acli (Jira) / gh issue (GitHub))
  atlassian_url: 'https://upexgalaxy72.atlassian.net' # Atlassian site base URL (e.g. https://company.atlassian.net). The only local copy of the host: never mirror it into .env

testing:
  default_env: staging # Default testing environment — must match a key under `environments:` (e.g. staging)
  tms_cli: bun xray # Test management CLI command (e.g. bun xray)

  # Which stage turns a test case into a `Test` work item in the TMS. One of:
  # auto | sprint-testing | test-documentation. `auto` (the shipped default) follows the
  # TMS modality resolved from `tms_cli`: jira-xray -> /sprint-testing Stage 1 (Xray's
  # `Test` IS the execution unit, so the item must exist during the sprint for the Test
  # Execution, coverage panel and Test Plan membership to work); jira-native -> Stage 4
  # /test-documentation (a native `Test` issue IS documentation, so creating one per sprint
  # outline fills the regression repository with cases that were never ROI-gated).
  # Override only when the project weighs repository cleanliness against in-sprint
  # traceability differently — the cost of each override is stated in
  # `.agents/skills/sprint-testing/SKILL.md` §"Which stage creates the TCs".
  # Read as {{TC_CREATION_STAGE}}; unset or unrecognized is treated as `auto`.
  tc_creation_stage: auto
  # NEW in 1.0.0 — added by `bun sync`, unset. See .agents/README.md.
  # Agentic browser sessions (`/playwright-cli`). Canon:
  # .agents/skills/agentic-qa-core/references/browser-sessions.md
  browser:
    # Agentic Pair Testing: the human and the AI test together in the human's own
    # running Chrome (`playwright-cli attach`), instead of the AI's own session.
    # null  = not chosen yet: the first agentic browser session presents both modes
    #         and saves the answer here (true | false), once.
    # true  = pair testing is the default mode for agentic browser sessions.
    # false = dedicated sessions by default; pair testing only on explicit request,
    #         after one confirmation. Unattended runs never pair, whatever the value.
    # Read directly by skills (not a {{VAR}} token).
    pair_mode: null

# NEW in 1.0.0 — added by `bun sync`, unset. See .agents/README.md.
# Host harnesses this project uses (ADR-0012), any of: claude, opencode, codex.
# Every compatibility gate (agents:compat:check, setup:doctor, the installer, `bun sync`)
# checks only these; the files of a harness left out may be deleted. null = detect from
# the files present (a harness is in use while ANY of its files exists). `bun setup`
# adds the agents you select (it never removes one); edit the list to drop one.
# The boilerplate itself always checks all three, whatever this says.
# Read directly by cli/lib/harness-selection.ts (not a {{VAR}} token) -> skipped by vars:check.
harnesses: null # e.g. [claude]

qa:
  formal_blocked_gate: true # When true and the substrate exposes a `blocked` story status, FAILED stories dispatch `defect_reported` (in_test -> blocked). When false (or no `blocked` slug), the skill leaves the story in `in_test` with the linked bug — non-strict fallback. See sprint-testing/references/sprint-orchestration.md Briefing 4 Step 5.
  # Jira LABEL that marks an Epic as a QA-artifact bucket rather than a product Epic.
  # `sync-jira-issues` keeps labelled Epics out of `.context/PBI/epics/` (which is the product
  # tree, one folder per Epic with its Stories nested) and indexes them in `qa-artifacts/`
  # instead. Without it, `QA Test Repository` and friends land beside real product Epics as
  # near-empty folders, because a Story query against them returns nothing.
  # A label is used rather than the epic name because a product Epic may legitimately start
  # with "QA ", and rather than the cached `qa_epics.*.key` below because those are `null`
  # until a skill discovers them — the label works from the first sync.
  # Whoever creates a QA-artifact Epic must apply it; the AI does so automatically.
  qa_artifact_label: QA-Artifact
  # QA process epics — buckets that hold QA artifacts so they never pollute product epics/roadmap.
  # FOUR QA-process epics form the QA-governance cluster: Test Plans parent to `master_test_plan_epic`;
  # Test (TC) issues parent to `test_repository_epic`; Test Executions/Preconditions/Test Sets parent to
  # `test_artifacts_epic`; Bug/Defect/Improvement parent to `defect_epic`.
  # Skills resolve the epic by NAME (the methodology convention shipped below) and find-or-create it,
  # caching the discovered `*.key` here. NEVER parent a quality issue to a product/dev epic.
  # Read directly by skills (not {{VAR}} tokens) → skipped by vars:check, like git_strategy leaves.
  # Doctrine: .claude/skills/agentic-qa-core/references/defect-management-doctrine.md (Part 4).
  qa_epics:
    master_test_plan_epic:
      name: QA Master Test Plan # the MTP — parent of every Test Plan (FTP/STP/ATP); description mirrors
      # .context/master-test-plan.md + points to the official QA repo; cross-linked to the 3 sibling QA epics
      key: null # discovered/created at runtime, then cached here (e.g. PROJ-100)
    test_repository_epic:
      name: QA Test Repository # convention name; holds every Test (TC) issue
      key: BK-70 # discovered 2026-08-06 during BK-41 sprint-testing
    test_artifacts_epic:
      name: QA Test Artifacts # holds every Test Execution (FTR/STR/ATR), Precondition, Test Set
      key: null # discovered/created at runtime, then cached here (e.g. PROJ-789)
    defect_epic:
      name: QA Defect Management # convention name; the `QA ` prefix marks a process epic, not product
      key: BK-183 # discovered 2026-08-06 during BK-41 sprint-testing
  # How THIS project runs the IQL. Read by the shipped `iql-context` skill (the methodology
  # index) and, through it, by every workflow skill that asks "which stages does this project
  # run and how strict are its gates". Read directly by skills (not {{VAR}} tokens) → skipped
  # by vars:check.
  methodology:
    # Stages this project actually runs, by NAME (never by number), from the ladder in
    # .agents/skills/agentic-qa-core/references/stage-gates.md.
    stages: [shift-left, planning, execution, reporting, documentation, automation, regression]
    # `strict` runs every DoD as written; `light` allows the collapsible gates named on the
    # official methodology site, one sprint at a time, with a debt item per collapse.
    gate_mode: strict
    # `agentic` (an agent executes the skills, the human decides at the declared points) or
    # `manual` (a person runs each stage). Documentation only: no skill branches on it.
    execution_profile: agentic

# Per-environment config. Add/remove environments freely (production, dev, qa, uat, etc.).
# Each environment must define ALL four keys: web_url, api_url, db_mcp, api_mcp.
# Skills referencing {{WEB_URL}} / {{API_URL}} / {{DB_MCP}} / {{API_MCP}} resolve to the
# active environment (`testing.default_env` above, or a session override).
# For explicit cross-env references use {{environments.<env>.<var>}} (e.g. {{environments.local.web_url}}).
environments:
  local:
    web_url: 'http://localhost:3000' # Frontend URL for local env (e.g. http://localhost:3000)
    api_url: 'http://localhost:3000/api' # API base URL for local env (e.g. http://localhost:3000/api)
    db_mcp: local-dbhub # MCP server name for local DB (e.g. myproject-local-db)
    api_mcp: local-openapi # MCP server name for local API (e.g. myproject-local-api)
  staging:
    web_url: 'https://staging-upexbunkai.vercel.app' # Frontend URL for staging env (e.g. https://staging.myproject.com)
    api_url: 'https://staging-upexbunkai.vercel.app/api' # API base URL for staging env (e.g. https://api-staging.myproject.com)
    db_mcp: staging-dbhub # MCP server name for staging DB (e.g. myproject-staging-db)
    api_mcp: staging-openapi # MCP server name for staging API (e.g. myproject-staging-api)

# Git workflow for THIS project — the SOURCE OF TRUTH read by the git-flow-master skill
# before any git/gh operation. Ships `null` (template): on the first git intent git-flow-master
# OFFERS "Strategy Setup" and fills these fields (it never auto-picks). Tracked + frozen by the
# updater (bootstrapOnly), so each project keeps its own. Filled by git-flow-master, NOT by
# `agents:setup`. These leaves are read directly (not {{VAR}} template vars) → skipped by vars:check.
git_strategy:
  strategy: sdet # null until Strategy Setup runs; then one of: solo-main | main-integration | enterprise | trunk-based | gitflow | github-flow | gitlab-flow | sdet
  description: >
    SDET integration-trunk model for chained test-automation suites. main is permanent and
    holds only confirmed regression-ready tests. Each suite gets an ephemeral integration
    trunk (test/<module>-suite) created on demand; per-ticket branches (test/{KEY}-{slug})
    are cut from the trunk, PR'd back into it, and merged with --no-ff so every ticket stays
    visible inside the suite. One final reviewed PR promotes the trunk into main. Opt-in only,
    never auto-detected; setup materializes no branches (main only) — the trunk is created
    per-suite by the Branch operation.
  branches:
    production: main # release / default branch
    integration: null # long-lived integration branch name (e.g. staging), or null
    ephemeral_pattern: test/<module>-suite # on-demand trunk pattern (e.g. "test/<module>-suite" for sdet), or null
  protected: [main] # branches requiring explicit confirm before a direct push
  decisions: # captured by the Strategy Setup questionnaire (Q1/Q2/Q3)
    promote_method: n/a # ff-only | merge-commit | squash | n/a
    feature_merge: merge-commit # FIXED for sdet: --no-ff, never squash (defining property)
    hotfix_policy: n/a # branch-off-prod-backmerge | via-integration | none | n/a
  policy: # how strictly protected branches are guarded (set by Strategy Setup Q4; defaults are safe)
    direct_push_to_protected: confirm # forbidden | confirm | allowed (sdet = confirm)
    admin_bypass: false # team POLICY: may a repo admin bypass PR/protection for urgent changes? actual capability still depends on the GitHub user's role — the skill re-confirms at runtime
    require_pr_reviews: 0 # min approvals for ticket→trunk PRs; the final trunk→main promotion PR requires 1
    # NEW in 1.0.0 — added by `bun sync`, unset. See .agents/README.md.
    # Host divergences that are ACCEPTED, not drift. Each `field` names a `git:policy verify`
    # finding verbatim (`<branch>.<policy_field>`); verify moves matching findings from DRIFT
    # to ACCEPTED (exit 0) and warns when an entry no longer matches anything (stale entry).
    # `apply` preserves the host's side for accepted fields instead of deriving its own rule.
    accepted_divergences: []
  branch_prefixes:
    precedence: [feat, fix, refactor, test, docs, chore]
    naming_with_key: '{prefix}/{ISSUE-KEY}-{kebab-slug}'
    naming_without_key: '{prefix}/{kebab-slug}'
  meta:
    setup_version: 2
    created: 2026-07-11 # YYYY-MM-DD stamped by Strategy Setup
    # NEW in 1.0.0 — added by `bun sync`, unset. See .agents/README.md.
    policy_verified: 2026-10-13 # YYYY-MM-DD of the last `bun run git:policy verify`. null = never reconciled against the host
    # NEW in 1.0.0 — added by `bun sync`, unset. See .agents/README.md.
    policy_source: verified # verified | accepted | declared. `verified` = host matches the yaml exactly; `accepted` = every divergence is formally listed in policy.accepted_divergences (stamped by `git:policy verify --stamp`); `declared` = never reconciled, or an unaccepted drift is open.
    # NEW in 1.0.0 — added by `bun sync`, unset. See .agents/README.md.
    # Did anyone actually CHOOSE this strategy, or is it just the shipped default?
    # `strategy:` above is never null, so its value alone cannot answer that. Strategy
    # Setup flips this to `chosen` when the questionnaire actually runs.
    strategy_source: chosen # inherited | chosen

# Defaults for multi-session orchestration (supervised worker fleets via Orca —
# see the orca-orchestration skill). Owned by that skill; read directly, NOT
# {{VAR}} template references in the section-prefixed sense (leaves resolve as
# flat {{VAR}} names like every other top-level section — see .agents/README.md
# §"orchestration" for the exact declared names). An explicit user instruction
# in the conductor session ALWAYS overrides these defaults for that run; they
# apply only when the user says nothing.
orchestration:
  max_workers: 4 # concurrent workers per round
  default_agent: claude # claude | codex | opencode
  default_model: '' # full provider model id; empty = the harness default
  default_effort: high # harness effort level when supported
  # WHICH orchestrator, named here instead of hardcoded in a skill. Empty
  # `orchestrator_cli` = no orchestrator on this machine: every workflow skill
  # falls back to the pasted-launch-line path and says NOTHING about it.
  orchestrator_name: Orca # the application the operator sees
  orchestrator_cli: '' # empty: Orca is not installed here; set to `orca` once it is on PATH
  # `message_verb` carries every message BETWEEN sessions. Byte-intact.
  # `terminal_verb` DRIVES a terminal: commands, CLI calls, harness slash-commands,
  # keystrokes. It truncates a long payload silently, so if a HUMAN would read it,
  # it does not go through `terminal_verb`.
  message_verb: orca orchestration # session-to-session messages ONLY
  terminal_verb: orca terminal # commands and keystrokes ONLY
  # Vendor skills the orchestrator installs at USER level, loaded alongside this
  # repo's own `orca-orchestration` skill. Empty list = none installed.
  orchestrator_skills: [orca-cli, orchestration]

# NEW in 1.0.0 — added by `bun sync`, unset. See .agents/README.md.
# Files `bun sync` must keep as THIS project's own. Read by `cli/update-boilerplate.ts`
# at the start of every run and merged into the protected watchlist
# (`PROTECTED_WATCHLIST` in `cli/update-boilerplate.ts`): a listed path is
# never overwritten, is delivered once from upstream when missing, and shows a drift row
# with hunk evidence when upstream's copy changes. List a SYNCED file you merged by hand
# (the parity row "project edit overwritten" names the path to add); repo-relative FILE
# paths only, no directories, nothing under .git. An invalid entry is reported and
# ignored. Empty by default. Read directly by the updater (not a {{VAR}} source): the
# nested list is skipped by vars:check like git_strategy and qa.qa_epics.
updater:
  protected_paths: [] # e.g. [scripts/lint-vars.ts, .agents/skills/acli/SKILL.md]
  # Upstream deny rules this project does NOT want appended to `.claude/settings.json`.
  # `bun sync` appends every upstream `permissions.deny` entry the project lacks (after a
  # backup; nothing removed or reordered); an entry listed here, by its exact text, is left
  # out and reported as declined. It never removes an entry the file already holds. Not a
  # list of strings = ignored with a warning (fails toward MORE denies). Read directly by
  # the updater (`readDeclinedDenies` in cli/lib/updater-settings.ts), skipped by vars:check.
  declined_denies: [] # e.g. ['Bash(env)']
  # Upstream hook commands this project does NOT want appended to `.claude/settings.json`.
  # `bun sync` appends every upstream hook command the project lacks under the same event
  # and matcher, as a NEW group at the end of that event's list (after a backup; the
  # project's own groups are never edited, reordered or removed); a command listed here, by
  # its exact text, is left out and reported as declined, in every event that runs it. A
  # hook `agents:compat:check` requires stays required: declining one keeps that check red.
  # Not a list of strings = ignored with a warning (fails toward MORE hooks). Read directly
  # by the updater (`readDeclinedHooks` in cli/lib/updater-settings.ts), skipped by vars:check.
  declined_hooks: [] # e.g. ['node "$CLAUDE_PROJECT_DIR/.agents/hooks/doc-contracts.mjs"']

# NEW in 1.0.0 — added by `bun sync`, unset. See .agents/README.md.
# Where SECRET values come from. `local` (the default) = .env / .env.local.
# A secret manager is the ADVANCED option (ADR-0010): `bun setup` writes the
# committed overlay .env.provider.schema (references only, never values).
# Read directly by the installer; not a {{VAR}} source.
secrets:
  provider: local # local | 1password
  onepassword:
    vault: null # vault the op:// references point at (e.g. myproject-dev; Private on a personal plan)
    account: null # sign-in shorthand from `op account list`; null = the CLI default account
    auth: app # app (desktop app locally, service account in CI) | service-account (token only)
